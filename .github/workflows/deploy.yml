# Build the backend Docker image and publish it to GHCR.
# Runs on every push to main. (The deploy-to-Pi step is added after Stage 5 —
# Cloudflare Tunnel — once the Pi is reachable from the internet.)
name: Build and publish backend image

# --- TRIGGER: what starts this workflow ---
on:
  push:
    branches: [main]          # only pushes to the main branch
  workflow_dispatch:          # also allow a manual "Run workflow" button

# --- PERMISSIONS: what the auto GITHUB_TOKEN is allowed to do ---
permissions:
  contents: read              # read the repo code
  packages: write             # push images to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest    # a fresh GitHub-hosted runner (amd64)

    steps:
      # 1. Get the repo's code onto the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. QEMU — lets the amd64 runner emulate arm64 (the Pi's CPU).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. buildx — Docker's multi-architecture builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to GHCR using the token GitHub auto-creates for this run.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build the image FOR arm64 and push it to GHCR.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .                                  # build from the repo root
          platforms: linux/arm64                      # the Pi's architecture
          push: true
          tags: ghcr.io/axlothecook/gaming-shop-backend:latest
